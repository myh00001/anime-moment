name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python sources
        run: python -m compileall -q service scripts tests
      - name: Install test dependencies
        run: python -m pip install numpy==1.24.4 Pillow==10.4.0
      - name: Build exact native image kernels
        run: bash scripts/build_native.sh
      - name: Check display geometry and persistent settings
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: bash -n scripts/install_dependencies.sh scripts/build_native.sh service/start.sh
      - name: Validate model metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('models-manifest.json').read_text())
          assert len(manifest['models']) == 5
          for model in manifest['models']:
              assert len(model['sha256']) == 64
              assert model['bytes'] > 0
          config = json.loads(Path('service/models/model-config.json').read_text())
          assert all(not model['output_tanh'] for model in config.values())
          PY
