<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>实时动漫相机</title>
<style>body{margin:0;background:#111622;color:#edf2fa;font:16px system-ui}main{max-width:1400px;margin:auto;padding:26px}h1{margin:0 0 8px}p{color:#aebed6}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#1d2635;border-radius:15px;padding:12px}video,canvas{transform:scaleX(-1);width:100%;aspect-ratio:16/9;object-fit:contain;background:#080c14;border-radius:8px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 0}button,select,input{font:inherit;padding:10px;border:0;border-radius:8px}button{background:#71e3bd;color:#10251f;cursor:pointer}button:disabled{opacity:.4}label{display:flex;align-items:center;gap:8px}#status{padding:16px;background:#1d2635;border-radius:10px;color:#90e6c7}@media(max-width:800px){.views{grid-template-columns:1fr}}</style>
<main><h1>实时动漫相机</h1><p>镜像显示 · 运动稳脸与日漫人物重绘 · S100 BPU 处理</p>
<div class="controls"><button id="start">开启实时摄像头</button><button id="stop" disabled>停止</button><button id="fullscreen">全屏动漫画面</button><select id="camera"><option value="">默认摄像头</option></select></div>
<p id="capture-info">默认按设备最高分辨率采集，并争取该分辨率下的最高帧率。</p>
<div class="controls"><label>上传长边（像素）<input id="upload-edge" aria-label="上传长边" type="number" min="0" max="8192" value="0" style="width:90px"></label><label>输出长边（像素）<input id="output-edge" aria-label="输出长边" type="number" min="320" max="1920" value="960" style="width:90px"></label><button id="apply">应用分辨率</button><span id="setting-result" role="status"></span></div>
<p>上传填 0 使用原尺寸；另一边按原画比例自动计算。输出 320–1920，实时预览推荐 640，清晰预览推荐 960；设置在下一帧生效并自动保存。</p>
<div class="views"><div class="panel">摄像头原画<video id="video" autoplay playsinline muted></video></div><div class="panel">实时动漫画面<canvas id="output" width="960" height="540"></canvas></div></div><p id="status">点击开启，允许浏览器使用摄像头。</p></main>
<script>
const $=id=>document.getElementById(id),video=$('video'),output=$('output'),capture=document.createElement('canvas');let stream=null,running=false,controller=null,generation=0,uploadEdge=0,outputEdge=960;
function applySettings(){const u=Number($('upload-edge').value),o=Number($('output-edge').value);if(!Number.isInteger(u)||u<0||u>8192||!Number.isInteger(o)||o<320||o>1920){$('setting-result').textContent='上传须为 0–8192，输出须为 320–1920 的整数';return false;}uploadEdge=u;outputEdge=o;try{localStorage.setItem('anime-resolution',JSON.stringify({uploadEdge,outputEdge}));}catch{}$('setting-result').textContent='已应用';return true;}
try{const saved=JSON.parse(localStorage.getItem('anime-resolution')||'null');if(saved){$('upload-edge').value=saved.uploadEdge;$('output-edge').value=saved.outputEdge;applySettings();}}catch{}
async function encodeCapture(){if(capture.convertToBlob)return capture.convertToBlob({type:'image/jpeg',quality:.95});const raw=atob(capture.toDataURL('image/jpeg',.95).split(',')[1]);return new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:'image/jpeg'});}
$('apply').onclick=applySettings;
async function listCameras(){let devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');let old=$('camera').value;$('camera').replaceChildren(...devices.map((d,i)=>new Option(d.label||`摄像头 ${i+1}`,d.deviceId)));if(devices.some(d=>d.deviceId===old))$('camera').value=old;}
function stop(){running=false;generation++;controller?.abort();stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('start').disabled=false;$('stop').disabled=true;$('status').textContent='已停止摄像头';}
async function start(){if(!applySettings())return;stop();let token=++generation;try{$('start').disabled=true;stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:$('camera').value?{exact:$('camera').value}:undefined,width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});video.srcObject=stream;const track=stream.getVideoTracks()[0];const caps=track.getCapabilities?.();if(caps?.width?.max&&caps?.height?.max){const maximum={width:{exact:caps.width.max},height:{exact:caps.height.max},frameRate:{ideal:caps?.frameRate?.max||120}};try{await track.applyConstraints(maximum);}catch{await track.applyConstraints({width:{ideal:caps.width.max},height:{ideal:caps.height.max},frameRate:{ideal:caps?.frameRate?.max||120}}).catch(()=>{});}}if(caps?.focusMode?.includes('continuous')){await track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});}if(caps?.exposureMode?.includes('continuous')){await track.applyConstraints({advanced:[{exposureMode:'continuous'}]}).catch(()=>{});}await video.play();const allowed=['frameRate','width','height','exposureMode','exposureTime','focusMode','focusDistance','iso','gain','brightness','contrast','sharpness','exposureCompensation'];const settings=track.getSettings();video.style.aspectRatio=video.videoWidth+'/'+video.videoHeight;$('capture-info').textContent=`实际采集 ${settings.width}×${settings.height} · ${Number(settings.frameRate||0).toFixed(1)} FPS（最高分辨率优先）`;fetch('/camera-info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capabilities:Object.fromEntries(allowed.filter(k=>caps&&k in caps).map(k=>[k,caps[k]])),settings:Object.fromEntries(allowed.filter(k=>k in settings).map(k=>[k,settings[k]]))})}).catch(()=>{});await listCameras();running=true;$('stop').disabled=false;$('status').textContent='摄像头已开启，正在生成第一帧…';await loop(token);}catch(e){stop();$('status').textContent='摄像头未启动：'+e.message;}}
async function loop(token){let frames=0,stamp=performance.now(),completed=[];while(running&&token===generation){try{const begin=performance.now();const scale=uploadEdge?Math.min(1,uploadEdge/Math.max(video.videoWidth,video.videoHeight)):1,cw=Math.max(1,Math.round(video.videoWidth*scale)),ch=Math.max(1,Math.round(video.videoHeight*scale));if(capture.width!==cw||capture.height!==ch){capture.width=cw;capture.height=ch;}capture.getContext('2d').drawImage(video,0,0,capture.width,capture.height);const encodedAt=performance.now();const blob=await encodeCapture();const encodingMs=performance.now()-encodedAt;if(!running||token!==generation)break;controller=new AbortController();const response=await fetch(`/frame?output_edge=${outputEdge}`,{method:'POST',body:blob,signal:controller.signal});if(!response.ok)throw Error(await response.text());const bitmap=await createImageBitmap(await response.blob());if(!running||token!==generation){bitmap.close();break;}if(output.width!==bitmap.width||output.height!==bitmap.height){output.width=bitmap.width;output.height=bitmap.height;output.style.aspectRatio=bitmap.width+'/'+bitmap.height;}output.getContext('2d').drawImage(bitmap,0,0);bitmap.close();frames++;let now=performance.now();completed.push(now);if(completed.length>20)completed.shift();const fps=completed.length>1?(completed.length-1)*1000/(now-completed[0]):1000/(now-stamp);$('status').textContent=`运行中 · 采集 ${video.videoWidth}×${video.videoHeight} · 上传 ${capture.width}×${capture.height} · 已更新 ${frames} 帧 · 实际输出 ${fps.toFixed(1)} FPS · 本帧采集至显示 ${(now-begin).toFixed(0)} ms · 编码 ${encodingMs.toFixed(0)} ms · 后端 ${response.headers.get('X-Processing-Ms')} ms · 输出 ${output.width}×${output.height} · ${response.headers.get('X-Inference-Backend')||'CUDA'} · 人脸增强 ${response.headers.get('X-Faces-Refined')} · 运动稳脸 ${response.headers.get('X-Faces-Stable')}`;}catch(e){if(e.name==='AbortError')break;stop();$('status').textContent='处理失败：'+e.message;break;}}}
$('fullscreen').onclick=()=>output.requestFullscreen();$('start').onclick=start;$('stop').onclick=stop;$('camera').onchange=()=>{if(running)start();};window.addEventListener('beforeunload',stop);listCameras().catch(()=>{});
</script></html>
